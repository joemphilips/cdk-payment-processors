[package]
name = "cdk-payment-processor-ldk-server"
version = "0.1.0"
edition = "2021"
authors = ["Vincenzo Palazzo <vincenzopalazzodev@gmail.com>"]
description = "CDK Payment Processor backed by an LDK Server node"
license = "MIT OR Apache-2.0"

[features]
default = []
regtest-tests = [
    "dep:axum",
    "dep:cdk",
    "dep:cdk-axum",
    "dep:cdk-sqlite",
    "dep:corepc-node",
    "dep:lightning-invoice",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-common = { version = "0.18.2", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "0.18.2", default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "sync", "net"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ldk-server deps

bitcoin = { version = "0.32.2", features = ["base64", "serde", "rand", "rand-std"] }
ldk-server-client = { git = "https://github.com/joemphilips/ldk-server", rev = "9bcc4b8b2d3c9fdaa3992a3b937bbfb00845a68a", default-features = false }
lightning = { version = "0.2.0", default-features = false, features = ["std"] }
tokio-util = "0.7"

# ldk-server regtest tests

axum = { version = "0.8", optional = true }
cdk = { version = "0.18.2", default-features = false, features = ["mint", "wallet"], optional = true }
cdk-axum = { version = "0.18.2", optional = true }
cdk-sqlite = { version = "0.18.2", default-features = false, features = ["mint", "wallet"], optional = true }
corepc-node = { version = "0.10", features = ["download", "29_0"], optional = true }
lightning-invoice = { version = "0.34", optional = true }

# A panic ends the process, so that it restarts with every task (src/main.rs
# refuses a release build with another strategy).
[profile.release]
panic = "abort"

[[test]]
name = "regtest"
path = "tests/regtest.rs"
required-features = ["regtest-tests"]

# bitCaster fork only: build against the bitCaster CDK fork, so that this
# processor speaks to the cdk-mintd of that fork. Remove this section before an
# upstream pull request.
[patch.crates-io]
cashu = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-axum = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-common = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-http-client = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-payment-processor = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-signatory = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-sql-common = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
cdk-sqlite = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
# The SQLite WAL correction of that fork (RUSTSEC-2026-0459). Only the test
# builds (`regtest-tests`) link SQLite.
libsqlite3-sys = { git = "https://github.com/joemphilips/cdk", rev = "eb6762c7af868e2a2086ff3602527ac8eb193007" }
